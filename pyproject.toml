[project]
name = "truck-manager-tools"
version = "0.1.0"
description = "Modular CLI tools that support playing the game Truck Manager."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pillow>=10.0",
    "pytesseract>=0.3.10",
]

[project.scripts]
trucklist = "truck_manager_tools.trucklist.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/truck_manager_tools"]
